name: nexora

services:

  # ==============================
  # NEXORA MAIN WEB APPLICATION
  # ==============================
  osiris:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora
    ports:
      - "${OSIRIS_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - osiris-intel
      - osiris-ai
    networks:
      - default
      - umami_default

  # ==============================
  # EXISTING OSINT INTELLIGENCE
  # ==============================
  osiris-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: osiris-intel
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - default

  # ==============================
  # NEW LOCAL VIDEO AI
  # ==============================
  osiris-ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: osiris-ai
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - default

  # ==============================
  # NGINX CACHE
  # ==============================
  osiris-cache:
    image: nginx:alpine
    container_name: osiris-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - osiris
    restart: unless-stopped
    networks:
      - default


# ==============================
# VOLUMES
# ==============================
volumes:
  nginx-cache:


# ==============================
# NETWORKS
# ==============================
networks:
  umami_default:
    external: true


# ==============================
# CASAOS INFORMATION
# ==============================
x-casaos:
  architectures:
    - amd64
    - arm64

  main: osiris

  author: simplifaisoul
  developer: simplifaisoul
  category: Network

  description:
    en_us: >-
      NEXORA is a vendor-agnostic digital video forensic analysis platform
      with local AI-powered video analysis.

  tagline:
    en_us: Local-first digital video forensics platform

  title:
    en_us: NEXORA

  icon: https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/casaos-icon.png

  thumbnail: https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/og-image.png

  screenshot_link:
    - https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/og-image.png

  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000

  envs:
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL."

    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret."

    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key."

    - container: AIS_API_KEY
      description:
        en_us: "(Optional) AIS maritime tracking API key."

    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Optional) OpenSky OAuth2 client ID."

    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Optional) OpenSky OAuth2 client secret."

    - container: N2YO_API_KEY
      description:
        en_us: "(Optional) N2YO satellite tracking API key."

  ports:
    - container: "3000"
      description:
        en_us: "NEXORA Web UI."

    - container: "4000"
      description:
        en_us: "NEXORA Intelligence Layer."

    - container: "5000"
      description:
        en_us: "NEXORA Local AI Video Analysis."